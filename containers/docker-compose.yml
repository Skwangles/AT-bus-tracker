version: '3.8'

services:
  model-generation:
    build:
      context: ./model-generation
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - model_input:/app/input
      - model_output:/app/output
    environment:
      - MODEL_INPUT_DIR=/app/input
      - MODEL_OUTPUT_DIR=/app/output
    networks:
      - cv_network

  map-processing:
    build:
      context: ./map-processing
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - map_input:/app/input
      - map_output:/app/output
    environment:
      - MAP_INPUT_DIR=/app/input
      - MAP_OUTPUT_DIR=/app/output
    networks:
      - cv_network

  blurring:
    build:
      context: ./blurring
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - blur_input:/app/input
      - blur_output:/app/output
    environment:
      - BLUR_INPUT_DIR=/app/input
      - BLUR_OUTPUT_DIR=/app/output
    networks:
      - cv_network

  authoring:
    build:
      context: ./authoring
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - author_input:/app/input
      - author_output:/app/output
    environment:
      - AUTHOR_INPUT_DIR=/app/input
      - AUTHOR_OUTPUT_DIR=/app/output
    networks:
      - cv_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    networks:
      - cv_network

networks:
  cv_network:
    driver: bridge

volumes:
  model_input:
  model_output:
  map_input:
  map_output:
  blur_input:
  blur_output:
  author_input:
  author_output: 