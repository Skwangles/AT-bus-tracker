<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Annotator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">Video Annotator</h1>
        
        <!-- Video Input Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Load Video</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="videoPath" class="form-label">Or paste video file path:</label>
                        <input type="text" class="form-control" id="videoPath" placeholder="Enter video file path">
                        <button class="btn btn-primary mt-2" id="loadPathBtn">Load from Path</button>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Or drag and drop video file:</label>
                        <div class="drop-zone border border-2 border-dashed p-5 text-center" id="dropZone">
                            <p class="mb-0">Drag and drop video file here</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Player Section -->
        <div class="card mb-4" id="videoSection" style="display: none;">
            <div class="card-header">
                <h5 class="mb-0">Video Player</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <video id="videoPlayer" class="w-100" controls></video>
                </div>
                <div class="mb-3">
                    <strong>Current Time: <span id="currentTime">0</span> ms</strong>
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="card mb-4" id="controlsSection" style="display: none;">
            <div class="card-header">
                <h5 class="mb-0">Annotations</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <button class="btn btn-success w-100" id="addAreaBtn">Add Area</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-info w-100" id="addMarkerBtn">Add Marker</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-warning w-100" id="toggleLoopBtn">Toggle Loop Detection</button>
                        <small class="d-block mt-1">Status: <span id="loopStatus">Enabled</span></small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Annotations Display -->
        <div class="card mb-4" id="annotationsSection" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Current Annotations</h5>
                <button class="btn btn-primary" id="downloadBtn">Download JSON</button>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <h6>Data Array (<span id="dataCount">0</span>)</h6>
                        <div id="dataList" class="list-group" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                    <div class="col-md-4">
                        <h6>User Defined (<span id="userDefinedCount">0</span>)</h6>
                        <div id="userDefinedList" class="list-group" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                    <div class="col-md-4">
                        <h6>Loop Detection (<span id="loopCount">0</span>)</h6>
                        <div id="loopList" class="list-group" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Area Modal -->
    <div class="modal fade" id="addAreaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Area</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addAreaForm">
                        <div class="mb-3">
                            <label for="areaName" class="form-label">Area Name</label>
                            <input type="text" class="form-control" id="areaName" list="areaSuggestions" required autocomplete="off">
                            <datalist id="areaSuggestions"></datalist>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitAreaBtn">Add Area</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Marker Modal -->
    <div class="modal fade" id="addMarkerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Marker</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addMarkerForm">
                        <div class="mb-3">
                            <label for="markerType" class="form-label">Marker Type</label>
                            <select class="form-select" id="markerType" required>
                                <option value="regular">Regular Point of Interest</option>
                                <option value="toilet">Toilet</option>
                                <option value="elevator">Elevator</option>
                                <option value="anchor">Anchor</option>
                            </select>
                        </div>
                        <div class="mb-3" id="descriptionField">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description">
                        </div>
                        <div class="mb-3" id="elevatorShaftField" style="display: none;">
                            <label for="elevatorShaft" class="form-label">Elevator Shaft Group Name</label>
                            <input type="text" class="form-control" id="elevatorShaft">
                        </div>
                        <div class="mb-3">
                            <label for="markerInfo" class="form-label">Info (Optional)</label>
                            <textarea class="form-control" id="markerInfo" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitMarkerBtn">Add Marker</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
