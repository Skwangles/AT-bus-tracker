<!DOCTYPE html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NB5836 · Live bus tracker</title>
    <meta name="description" content="Live location tracker for Auckland Transport bus NB5836." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand-bar">
        <p class="eyebrow">Auckland Transport · live</p>
        <h1 class="brand" id="fleetBrand">NB5836</h1>
        <p class="lede" id="plateLine">Plate QCH657 · waiting for signal</p>
      </header>

      <section class="status-strip" aria-live="polite">
        <div class="status-pill" id="statusPill" data-state="searching">
          <span class="pulse" aria-hidden="true"></span>
          <span id="statusText">Searching</span>
        </div>
        <dl class="meta">
          <div>
            <dt>Route</dt>
            <dd id="routeValue">—</dd>
          </div>
          <div>
            <dt>Updated</dt>
            <dd id="updatedValue">—</dd>
          </div>
          <div>
            <dt>Next poll</dt>
            <dd id="nextPollValue">—</dd>
          </div>
        </dl>
      </section>

      <section class="map-stage" aria-label="Live map of bus location">
        <div id="map" role="application" aria-label="Map showing bus NB5836"></div>
        <p class="map-caption" id="mapCaption">Map centres on Auckland until NB5836 reports.</p>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
