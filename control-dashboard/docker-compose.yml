version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CV_VIDEO_DIR=/app/videos
      - CV_KEYFRAME_IMG_DIR=/app/images
      - CV_DB_DIR=/app/db
      - SETTINGS_FILE=/app/config/settings.json
    volumes:
      - ./server/src:/app/src
      - ./server/dist:/app/dist
      - ./server/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true 