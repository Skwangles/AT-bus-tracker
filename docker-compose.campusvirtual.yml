services:
  backend:
    build:
      context: ./Apps/campusvirtual-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3001:3001'
    env_file: .env
    volumes:
      - '${CV_KEYFRAME_IMG_DIR}:/app/served-img/'
      - '${CV_SERVER_FLOORPLAN_IMG_DIR}:/app/served-floorplans/'
      - '${CV_DB_DIR}:/app/served-map/'
    environment:
      - NODE_ENV=production
      - CV_KEYFRAME_IMG_DIR=/app/served-img/
      - CV_SERVER_FLOORPLAN_IMG_DIR=/app/served-floorplans/
      - CV_DB_DIR=/app/served-map/
